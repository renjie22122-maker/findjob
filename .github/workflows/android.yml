name: Android build
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'server/scripts/android-model-test.mjs', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node server/scripts/android-model-test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - run: gradle -p android testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: CareerFlow-Android
          path: android/app/build/outputs/apk/debug/*.apk

