<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CareerFlow</title><style>
:root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172439;--muted:#64748b;--line:#dce3ef} @media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#182231;--text:#edf3ff;--muted:#a9b6cb;--line:#334156}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;padding:32px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:30px;margin:0}h2{font-size:19px;margin:0 0 12px}p{line-height:1.65;color:var(--muted)}section,article{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0}button{background:#395fe8;color:white;border:0;border-radius:12px;padding:12px 16px;min-height:44px;font:inherit;margin:4px 4px 4px 0}input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:inherit}small{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}.row{display:flex;gap:8px;align-items:center}.status{padding:12px;border-radius:12px;background:var(--bg)}summary{padding:12px 0;cursor:pointer}label{display:block;padding:16px 0}button.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}</style>
<header><div><small>CAREERFLOW · ANDROID PREVIEW</small><h1 id="brand"></h1></div><button class="secondary" id="lang">EN</button></header>
<h2 id="heading"></h2><p id="intro"></p><section><h2 id="setupTitle"></h2><p id="setupText"></p><input id="key" type="password" autocomplete="off" placeholder="DeepSeek API Key"><button id="save"></button><label><input id="auto" type="checkbox"> <span id="autoLabel"></span></label><button id="import"></button><p class="status" id="status"></p></section><h2 id="inboxTitle"></h2><div id="list"></div>
<script>
let english=localStorage.getItem('language')==='en';const t=(zh,en)=>english?en:zh;const el=id=>document.getElementById(id);const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
function render(){el('brand').textContent=t('赴程','CareerFlow');el('lang').textContent=english?'中文':'EN';el('heading').textContent=t('招聘通知，留在手机上','Your career inbox, on your phone');el('intro').textContent=t('独立运行预览版 · 不依赖电脑。当前支持短信收集、AI提取与完成状态。尚未包含邮箱同步、完整申请合并和定时提醒；请继续使用现有日程作为正式提醒依据。','Standalone preview. SMS collection, AI extraction and completion tracking. Email sync, full application reconciliation and scheduled reminders are not included yet. Keep your existing calendar for reminders.');el('setupTitle').textContent=t('连接你的 AI','Connect your AI');el('setupText').textContent=t('密钥加密保存在本机。开启自动处理后，仅将筛选并隐藏敏感链接的招聘短信发送给 DeepSeek。验证码和无关短信不入库。','Your key is encrypted on this device. When enabled, only filtered recruitment messages with sensitive links removed go to DeepSeek. Authentication and unrelated messages are discarded.');el('save').textContent=t('保存密钥','Save key');el('autoLabel').textContent=t('自动收集并分析新招聘短信','Automatically collect and analyze new recruitment SMS');el('import').textContent=t('检查最近200条短信','Check the latest 200 messages');el('inboxTitle').textContent=t('招聘收件箱','Recruitment inbox');
 const state=JSON.parse(CareerFlow.state());el('auto').checked=state.auto;el('status').textContent=state.configured?t('API已配置 · 后台处理受Android电池策略影响，打开页面可查看更新','API configured. Android battery policies may delay background work.'):t('先配置密钥，再开启自动分析','Add an API key before enabling automatic analysis');el('list').replaceChildren();if(!state.items.length)el('list').append(node('p',t('尚无招聘通知。授权后检查短信，或等待新的通知。','No messages yet. Grant SMS access and check your inbox, or wait for new messages.')));
 for(const item of state.items){const card=node('article',''),a=item.analysis;card.append(node('small',new Date(item.received).toLocaleString(english?'en':'zh-CN')),node('h2',a?.company||t('待分析招聘通知','Recruitment message')));if(a){card.append(node('p',a.summary||''),node('pre',[a.event,a.start,a.end,a.location].filter(Boolean).join('\n')),node('small',t('AI提取草稿，请核对原文；尚未创建定时提醒','AI draft: verify against the source. No scheduled reminder has been created.')))}else{card.append(node('p',t('等待分析；如果持续无结果，请检查网络与密钥后重试','Waiting for analysis. Check your network and API key if this persists.')));const retry=node('button',t('分析／重试','Analyze / retry'));retry.onclick=()=>CareerFlow.analyze(item.id);card.append(retry)}const details=document.createElement('details');details.append(node('summary',t('查看短信依据','View source')),node('pre',item.body));card.append(details);const done=node('button',item.done?t('已完成 · 撤销','Completed · undo'):t('标为完成','Mark complete'));done.className='secondary';done.onclick=()=>{CareerFlow.done(item.id,!item.done);render()};card.append(done);el('list').append(card)}
}
el('lang').onclick=()=>{english=!english;localStorage.setItem('language',english?'en':'zh');render()};el('save').onclick=()=>{if(el('key').value.length<10){alert(t('请填写完整密钥','Enter a complete API key'));return}CareerFlow.saveKey(el('key').value);el('key').value='';render()};el('auto').onchange=()=>CareerFlow.automatic(el('auto').checked);el('import').onclick=()=>{const result=CareerFlow.importRecent();alert(result==='permission'?t('请授予短信读取权限后再次点击检查','Grant SMS access, then check again'):t('新增招聘短信：','New recruitment messages: ')+result);render()};render();setInterval(()=>{if(!document.hidden&&!el('key').value)render()},15000);
</script></html>
