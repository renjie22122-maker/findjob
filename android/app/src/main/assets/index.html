<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'"><title>CareerFlow</title><link rel="stylesheet" href="style.css"><body>
<header class="app-header"><div class="brand-lockup"><span class="brand-mark" aria-hidden="true">↗</span><div><small>CAREERFLOW</small><h1 id="brand">赴程</h1></div></div><div class="header-tools"><button id="theme" aria-label="主题 / Theme">◐</button><button id="lang">EN</button></div></header>
<p id="intro" class="page-intro"></p><main>
<section id="schedulePanel" class="page-panel"><div class="overview"><div class="overview-top"><span id="overviewLabel"></span><span class="local-pill" id="localLabel"></span></div><h2 id="scheduleTitle"></h2><div id="metrics" class="metrics"></div></div><div class="permission-hint"><p id="permissions"></p><button id="setupReminders"></button></div><div id="schedules" class="schedule-list"></div></section>
<section id="inboxPanel" class="page-panel" hidden><div class="section-heading"><h2 id="inboxTitle"></h2><button class="quiet" id="refreshInbox"></button></div><div id="inbox"></div></section>
<section id="settingsPanel" class="page-panel" hidden><h2 id="settingsTitle"></h2><p id="privacy" class="privacy-note"></p>
<details class="settings-group" open><summary id="reminderTitle"></summary><p id="settingsPermissions"></p><div class="button-row"><button class="secondary" id="notifications"></button><button class="secondary" id="alarms"></button></div><button class="quiet" id="testReminder"></button></details>
<details class="settings-group" open><summary id="aiTitle"></summary><small id="apiState"></small><label>DeepSeek API Key<input id="key" type="password" autocomplete="off" placeholder="sk-…"></label><button id="saveKey"></button></details>
<details class="settings-group"><summary id="smsTitle"></summary><label class="toggle-row"><span id="autoLabel"></span><input id="auto" type="checkbox" role="switch"></label><button class="secondary" id="import"></button></details>
<details class="settings-group" open><summary id="outlookTitle"></summary><p id="outlookHelp"></p><label>Microsoft Client ID<input id="clientId" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><div class="field-row"><label>Tenant<input id="tenant" value="consumers" autocomplete="off"></label><label>Outlook Email<input id="outlookUser" type="email" autocomplete="off" placeholder="you@outlook.com"></label></div><button id="outlookStart"></button><div class="authorization-code" id="outlookCodeBox" hidden><code id="outlookCode"></code><small id="outlookExpiry"></small></div><button id="outlookCopy" class="secondary"></button><div class="button-row"><button class="secondary" id="outlookOpen"></button><button class="quiet" id="outlookCancel"></button></div><pre id="outlookStatus" class="connection-state"></pre></details>
<details class="settings-group" id="imapGroup"><summary id="imapLabel"></summary><h2 id="mailTitle"></h2><p id="mailHelp"></p><label>IMAP Host<input id="host" placeholder="imap.qq.com" autocomplete="off"></label><label>Email<input id="user" type="email" autocomplete="off" placeholder="you@example.com"></label><label id="passwordLabel">Password / 授权码<input id="password" type="password" autocomplete="off"></label><button id="saveMail"></button></details>
<div class="settings-group"><div class="section-heading"><h2 id="syncTitle"></h2><button class="secondary" id="sync"></button></div><p id="mailStatus" class="connection-state"></p><button class="quiet" id="disableMail"></button></div>
<details class="settings-group"><summary id="historyTitle"></summary><div id="history"></div></details>
</section></main><p role="status" aria-live="polite" id="feedback"></p><nav id="tabs" aria-label="主要导航 / Main navigation"></nav><script src="app.js"></script></body></html>
